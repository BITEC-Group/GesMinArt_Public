<meta charset="utf-8">

<div id="login">

    <div class="demo-users" id="demoUsers"></div>
    <p class="muted small" style="margin:10px 0 0">Données de démonstration : personnes fictives ; géographie et sites issus de sources publiques (OpenStreetMap, geoBoundaries).</p>

</div>
