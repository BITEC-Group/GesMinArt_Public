<!doctype html>
<html lang="fr">
<head><script>window.DEMO_BASE="/GesMinArt_Public";</script><script src="/GesMinArt_Public/demo-shim.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GesMinArt — Vérification d'un certificat d'agrément</title>
<style>
  :root { --bleu: #007FFF; --marine: #0a2a5e; --fond: #f3f6fc; --carte: #fff; --texte: #14233f; --bord: #dde5f3; }
  @media (prefers-color-scheme: dark) { :root { --fond: #0b1220; --carte: #131c2e; --texte: #e6edf8; --bord: #26334d; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fond); color: var(--texte); }
  .tri { height: 4px; background: linear-gradient(90deg, #007FFF 0 36%, #F7D618 36% 43%, #CE1126 43% 64%, #F7D618 64% 71%, #007FFF 71%); }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 6px 0 14px; }
  .banniere { border-radius: 14px; padding: 18px; color: #fff; text-align: center; font-weight: 800; font-size: 22px; letter-spacing: .5px; }
  .banniere small { display: block; font-weight: 500; font-size: 13px; margin-top: 4px; opacity: .95; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 6px 16px; margin-top: 14px; }
  .l { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--bord); font-size: 14px; } .l:last-child { border: 0; }
  .l span:first-child { color: #6b7a99; flex: none; } .l span:last-child { text-align: right; font-weight: 600; }
  .note { font-size: 12px; opacity: .8; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="tri"></div>
<main>
  <h1>★ GesMinArt — Vérification d'un certificat d'agrément</h1>
  <div id="res"><div class="banniere" style="background:#667">Vérification en cours…</div></div>
  <p class="note">Le statut affiché est celui en vigueur au moment de la lecture. La signature du QR code est contrôlée par le serveur : un QR modifié ou falsifié est rejeté.</p>
</main>
<script>
  const P = new URLSearchParams(location.search), c = P.get('c') || '', s = P.get('s') || '', dd = P.get('d');
  const LIB = { valide: ['CERTIFICAT VALIDE', '#1a7f45'], expire: ['CERTIFICAT EXPIRÉ', '#c0152a'], suspendu: ['CERTIFICAT SUSPENDU', '#c26a00'] };
  const fr = d => (d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' }) : '—');
  const esc = x => String(x ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const ligne = (l, v) => `<div class="l"><span>${l}</span><span>${esc(v)}</span></div>`;
  const res = document.getElementById('res');
  const detailsQr = () => { try { return JSON.parse(decodeURIComponent(escape(atob((dd || '').replace(/-/g, '+').replace(/_/g, '/'))))); } catch { return null; } };
  const cc = P.get('cc');
  if (cc) (async () => {
    document.querySelector('h1').textContent = '★ GesMinArt — Vérification d\'un contrôle de conformité cadastrale';
    try {
      const r = await fetch('/api/public/cami/verifier?id=' + encodeURIComponent(cc) + '&s=' + encodeURIComponent(s)); const j = await r.json();
      if (!r.ok) throw new Error(j.erreur || 'Erreur ' + r.status);
      if (!j.authentique) { res.innerHTML = '<div class="banniere" style="background:#c0152a">DOCUMENT NON AUTHENTIQUE<small>' + esc(j.motif) + '</small></div>'; return; }
      const ok = j.type_document === 'certificat_conformite';
      res.innerHTML = '<div class="banniere" style="background:' + (ok ? '#1a7f45' : '#c0152a') + '">' + (ok ? 'CERTIFICAT DE CONFORMITÉ' : 'CONSTAT DE NON-CONFORMITÉ') + '<small>Authenticité confirmée par le serveur</small></div><div class="carte">'
        + ligne('Titre', j.numero) + ligne('Titulaire', j.titulaire || '—') + ligne('Province', j.province || '—') + ligne('Statut au cadastre', j.statut_cami || '—') + ligne('Expiration du titre', fr(j.date_expiration))
        + ligne('Contrôle de position', !j.position_controlee ? 'Non contrôlée' : j.dans_perimetre ? 'Dans le périmètre' : 'Hors périmètre' + (j.distance_m != null ? ' (à ' + Math.round(j.distance_m) + ' m de la bordure)' : '')) + ligne('Contrôle effectué le', new Date(j.controle_le).toLocaleString('fr-FR'))
        + (j.motifs && j.motifs.length ? ligne('Motifs', j.motifs.join(' ; ')) : '') + '</div>';
    } catch (e) { res.innerHTML = '<div class="banniere" style="background:#667">VÉRIFICATION IMPOSSIBLE<small>' + esc(e.message) + '</small></div>'; }
  })(); else (async () => {
    try {
      const r = await fetch('/api/public/agrement/verifier?c=' + encodeURIComponent(c) + '&s=' + encodeURIComponent(s));
      const j = await r.json();
      if (!r.ok) throw new Error(j.erreur || 'Erreur ' + r.status);
      if (!j.authentique) { res.innerHTML = `<div class="banniere" style="background:#c0152a">CERTIFICAT NON AUTHENTIQUE<small>${esc(j.motif)}</small></div>`; return; }
      const [t, col] = LIB[j.statut] || [String(j.statut).toUpperCase(), '#555'];
      res.innerHTML = `<div class="banniere" style="background:${col}">${t}<small>Authenticité confirmée par le serveur</small></div><div class="carte">${ligne('N° du certificat', j.numero)}${ligne('Entité', j.nom)}${ligne('Catégorie', j.categorie_libelle)}${ligne('Province', j.province)}${ligne('Responsable', j.responsable_nom)}${ligne('Délivré le', fr(j.date_delivrance))}${ligne('Valable jusqu\'au', fr(j.date_expiration))}${ligne('Autorité', j.autorite)}</div>`;
    } catch (e) {
      const d = detailsQr();
      res.innerHTML = `<div class="banniere" style="background:#667">VÉRIFICATION IMPOSSIBLE<small>${esc(e.message)} — informations du QR non vérifiées</small></div>` + (d ? `<div class="carte">${ligne('N° du certificat', d.n)}${ligne('Entité', d.e)}${ligne('Responsable', d.r)}${ligne('Valable jusqu\'au', fr(d.x))}${ligne('Statut à l\'émission du QR', d.s)}</div>` : '');
    }
  })();
</script>
</body>
</html>
